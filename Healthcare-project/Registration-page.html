<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATION FORM</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="container">
        <div class="regform">
            <div class="join"><span>Join</span> Medicare</div>
            <form action="/server" class="regin">
                <label for="username"><i class="fa-solid fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Enter your name " required>
                </label>
                <label for="gamil"><i class="fa-solid fa-envelope"></i>
                    <input type="email" id="gamil" name="email" placeholder="Email id " required>
                </label>
                <label for="phnnumber"><i class="fa-solid fa-mobile"></i>
                    <input type="contact" id="phnnumber" name="number" placeholder="contact number" required>
                </label>
                <label for="password"><i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Create new password" required>
                </label>
                <button id="register"><a href="login_f.html" style="text-decoration: none;">REGISTER NOW</a></button>
            </form>
        </div>
        <div class="img"><img src="register-img.jpeg" alt="register faculty"></div>
    </div>
</body>

</html>
