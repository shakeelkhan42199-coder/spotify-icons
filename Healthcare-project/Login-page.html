<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN FORM</title>
    <link rel="stylesheet" href="login_f.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
            <div id="img">

             </div>
<div id="content">
             <div id="logo">
               <span>Log</span> into MediCare
            </div>
            <div class="inner">
    <form action="/server">
            
            <div id="email">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" placeholder="Enter Your Email" name="email" value="" class="inp" required>
            </div>
             <div id="password">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Enter Your Password" name="password" value="" class="inp" required>
            </div>
             <div id="info" class="click">
                <span><a href="" id="pass">Forget Password?</a></span>
             </div>
            <div id="btn" class="click">
                <button type="submit"><a href="homepage.html" style="text-decoration: none; color: white;">Continue</a></button>
            </div>
            <div id="register" class="click">
            <span><a href="register.html" target="_main">Create New Account</a></span>
            </div> 
            </div>
    </form>
</div>
</body>
</html>
